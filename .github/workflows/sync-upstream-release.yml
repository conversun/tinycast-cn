name: Sync upstream release

run-name: "Sync Tinycast release ${{ inputs.upstream_tag || 'latest' }}"

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional upstream release tag; empty selects the latest published release"
        type: string
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-26
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      upstream_tag: ${{ steps.meta.outputs.upstream_tag }}
      source_commit: ${{ steps.merge.outputs.source_commit }}
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          XCODE_CANDIDATES=(/Applications/Xcode_26*.app)
          if [ ! -e "${XCODE_CANDIDATES[0]}" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            exit 1
          fi
          XCODE_PATH="$(printf '%s\n' "${XCODE_CANDIDATES[@]}" | sort -V | tail -n1)"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Resolve upstream release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_REPOSITORY: abue-ammar/tinycast
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            RELEASE="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${REQUESTED_TAG}")"
          else
            # /releases/latest, not /releases: that list is newest-first and counts betas as latest.
            RELEASE="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          fi
          UPSTREAM_TAG="$(jq -r '.tag_name' <<< "$RELEASE")"
          PRERELEASE="$(jq -r '.prerelease' <<< "$RELEASE")"
          if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Unsupported upstream tag '$UPSTREAM_TAG'."
            exit 1
          fi
          VERSION="${UPSTREAM_TAG#v}-cn.1"
          RELEASE_TAG="v${VERSION}"
          SHOULD_RELEASE=true
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            SHOULD_RELEASE=false
            echo "Release $RELEASE_TAG already exists; nothing to do."
          fi
          {
            echo "should_release=${SHOULD_RELEASE}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "upstream_tag=${UPSTREAM_TAG}"
          } >> "$GITHUB_OUTPUT"

      # A localization fork conflicts with upstream by design, so a blocked merge is news, not a
      # fault: it reports through the issue below and leaves the run green.
      - name: Merge upstream release into main
        id: merge
        if: steps.meta.outputs.should_release == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/abue-ammar/tinycast.git
          git fetch --no-tags upstream "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          # Called on the main shell, never down a pipe: a subshell's `exit` would not stop the step.
          report() {
            {
              echo "merged=false"
              echo "blocker=$1"
              echo "detail<<TINYCAST_EOF"
              printf '%s\n' "$2"
              echo "TINYCAST_EOF"
            } >> "$GITHUB_OUTPUT"
          }
          if ! git merge --no-edit "$UPSTREAM_TAG"; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            report conflict "$CONFLICTS"
            exit 0
          fi
          if ! ./Scripts/run-tests.sh > /tmp/tests.log 2>&1; then
            cat /tmp/tests.log
            report tests "$(tail -n 40 /tmp/tests.log)"
            exit 0
          fi
          git push origin HEAD:main
          {
            echo "merged=true"
            echo "source_commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # One open issue per upstream tag: a repeat dispatch must not restate the same news.
      - name: Report a blocked sync
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
          BLOCKER: ${{ steps.merge.outputs.blocker }}
          DETAIL: ${{ steps.merge.outputs.detail }}
        run: |
          TITLE="Sync ${UPSTREAM_TAG} needs a hand"
          OPEN="$(gh issue list --state open --search "${TITLE} in:title" --limit 100 --json title \
            --jq "map(select(.title == \"${TITLE}\")) | length")"
          if [ "$OPEN" != "0" ]; then
            echo "Issue '${TITLE}' is already open; nothing to add."
            exit 0
          fi
          if [ "$BLOCKER" = "conflict" ]; then
            SUMMARY="\`git merge ${UPSTREAM_TAG}\` stopped on conflicts in these files:"
          else
            SUMMARY="The merge applied cleanly but \`./Scripts/run-tests.sh\` failed. Last 40 lines:"
          fi
          LABEL_ARGS=()
          if gh label create sync-blocked --color FBCA04 --description "Upstream sync needs a human" --force; then
            LABEL_ARGS=(--label sync-blocked)
          else
            echo "::warning::Could not create sync-blocked; reporting without a label."
          fi
          gh issue create --title "$TITLE" "${LABEL_ARGS[@]}" --body "$(cat <<EOF
          Upstream published \`${UPSTREAM_TAG}\`. Nothing has been pushed to \`main\`.

          ${SUMMARY}

          \`\`\`
          ${DETAIL}
          \`\`\`

          To resolve locally:

          \`\`\`sh
          git fetch --no-tags origin refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}
          git switch -c sync/${UPSTREAM_TAG} main
          git merge ${UPSTREAM_TAG}
          \`\`\`

          Close this issue once \`main\` carries the merge; the next scheduled run picks the release up.
          EOF
          )"

  release:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/release-cn.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      prerelease: ${{ needs.sync.outputs.prerelease == 'true' }}
      upstream_tag: ${{ needs.sync.outputs.upstream_tag }}
      ref: ${{ needs.sync.outputs.source_commit }}
    secrets: inherit
