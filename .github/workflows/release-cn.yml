name: Release CN

run-name: "Tinycast CN ${{ inputs.version }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CN version, e.g. 0.8.2-beta.37-cn.2"
        type: string
        required: true
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: true
      upstream_tag:
        description: "Upstream Tinycast release tag"
        type: string
        required: true
      ref:
        description: "Source branch, tag, or commit"
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      prerelease:
        type: boolean
        default: false
      upstream_tag:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      SIGNING_P12_BASE64:
        required: true
      SIGNING_P12_PASSWORD:
        required: true

permissions:
  contents: write

concurrency:
  group: "tinycast-cn-release-${{ inputs.version }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode 26
        run: |
          XCODE_CANDIDATES=(/Applications/Xcode_26*.app)
          if [ ! -e "${XCODE_CANDIDATES[0]}" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            exit 1
          fi
          XCODE_PATH="$(printf '%s\n' "${XCODE_CANDIDATES[@]}" | sort -V | tail -n1)"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and verify Universal app
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./Scripts/run-tests.sh
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Tinycast Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_BUNDLE_IDENTIFIER="com.conversun.tinycast-cn" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          BIN="$RUNNER_TEMP/DerivedData/Build/Products/Release/Tinycast.app/Contents/MacOS/Tinycast"
          ARCHS_BUILT="$(lipo -archs "$BIN")"
          for WANT in arm64 x86_64; do
            case " $ARCHS_BUILT " in
              *" $WANT "*) ;;
              *) echo "::error::Missing $WANT slice; built: $ARCHS_BUILT"; exit 1 ;;
            esac
          done

      - name: Package DMG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          STAGE="$(mktemp -d)"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release/Tinycast.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "Tinycast" \
            "dist/Tinycast-CN-${VERSION}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-CN-${{ inputs.version }}
          path: dist/Tinycast-CN-${{ inputs.version }}.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG=(--prerelease); fi
          # printf, not a heredoc: a heredoc body would have to sit at column 0 and break the
          # YAML block scalar. %s for the backticks keeps the shell from running the fences.
          BT='```'
          printf '%s\n\n%ssh\nbrew trust --tap conversun/tinycast-cn\nbrew tap conversun/tinycast-cn\nbrew install --cask tinycast-cn\n%s\n\n%s\n\n%ssh\nxattr -dr com.apple.quarantine "/Applications/Tinycast.app"\n%s\n\n%s\n' \
            '**推荐通过 Homebrew 安装** —— 安装和更新时会自动清除 quarantine 标记，不用手动跑任何命令：' \
            "$BT" "$BT" \
            '直接下载 DMG 的话，本构建是自签名的，macOS 会拦下它，需要清除一次隔离标记：' \
            "$BT" "$BT" \
            "基于上游 [${UPSTREAM_TAG}](https://github.com/abue-ammar/tinycast/releases/tag/${UPSTREAM_TAG}) 同步构建。" \
            > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" "dist/Tinycast-CN-${VERSION}.dmg" \
            --target "$SOURCE_COMMIT" \
            --title "Tinycast CN ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${PRERELEASE_FLAG[@]}"

      # A deploy key on the tap, not a PAT: write access to exactly one repo and nothing else.
      # Skipped for a prerelease: `brew upgrade --cask tinycast-cn` is the stable channel.
      - name: Update Homebrew cask
        if: ${{ !inputs.prerelease }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${TAP_DEPLOY_KEY}" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set — skipping the cask bump."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/Tinycast-CN-${VERSION}.dmg" | awk '{print $1}')"
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:conversun/homebrew-tinycast-cn.git tap
          CASK_FILE="tap/Casks/tinycast-cn.rb"
          # Anchored so the sha256 inside a comment or URL can never be the one rewritten.
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tinycast-cn.rb
          if git diff --cached --quiet; then
            echo "Cask already at ${VERSION}."
          else
            git commit -m "tinycast-cn ${VERSION}"
            git push
          fi
          rm -f "$KEY"
