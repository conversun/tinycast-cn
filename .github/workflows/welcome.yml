name: Welcome

# Thanks first-touch on every issue and PR.
# pull_request_target (not pull_request) so forked PRs still get a comment — no checkout, so
# there's no untrusted-code-execution risk from using the _target event.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks for opening this! A maintainer will review it shortly."
            });

      - name: Comment on pull request
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              "Thanks for the PR! A maintainer will review it shortly.",
              "",
              "If there's no issue behind this yet, please open one and link it here so the bug or feature can be",
              "agreed on first. Typo and docs-only fixes don't need one.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
